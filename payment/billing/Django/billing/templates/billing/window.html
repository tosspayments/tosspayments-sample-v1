<!DOCTYPE html>
<html lang="ko">
  {% load static %}

  <head>
    <title>구매하기</title>
    <meta charset="UTF-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="stylesheet" type="text/css" href="{% static 'billing/bulma/bulma.min.css' %}" />

    <script src="https://js.tosspayments.com/v1"></script>
  </head>

  <body>
    <section class="hero is-link">
      <div class="hero-body">
        <div class="container">
          <h1 class="title">빌링 (자동결제)</h1>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <button class="button is-link" onclick="billing('카드',jsons.card);">빌링(자동결제)</button>
      </div>
    </section>
  </body>

  <script>
    let amount = 50000;

    let tossPayments = TossPayments("{CLIENT_KEY}");

    function billing(method, requestJson) {
      console.log(requestJson);
      tossPayments.requestBillingAuth(method, requestJson).catch(function (error) {
        if (error.code === "USER_CANCEL") {
          alert("유저가 취소했습니다.");
        } else {
          alert(error.message);
        }
      });
    }

    let path = "/";
    let billingSuccessUrl = window.location.origin + path + "billing/billing_confirm";
    let failUrl = window.location.origin + path + "billing/fail";

    let jsons = {
      card: {
        // 샘플에서는 브라우저의 암호학적 난수(crypto.randomUUID)로 만들어요. 실제 서비스에서는 서버가 로그인한 구매자 기준으로 정한 customerKey 를 쓰세요.
        customerKey: window.crypto.randomUUID(),
        successUrl: billingSuccessUrl,
        failUrl: failUrl,
      },
    };
  </script>
</html>
